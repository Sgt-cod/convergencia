name: Gerar e Publicar Vídeo Longo

on:
  schedule:
    - cron: '0 19 * * *'  # 16:00 BRT (UTC-3), segunda e quinta
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-video:
    runs-on: ubuntu-latest
    # Sem isso o padrão do GitHub Actions é 6h — tempo demais pra um travamento
    # silencioso (download travado, deadlock de ffmpeg etc.) ficar rodando sem
    # avisar ninguém. 4h dá folga generosa pro vídeo longo (múltiplos capítulos +
    # pausas de revisão manual no Telegram, até 30 min de espera por clipe).
    timeout-minutes: 240

    steps:
      - name: Checkout código
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar FFmpeg e ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Liberar política do ImageMagick (necessário para legendas)
        run: |
          POLICY_FILE="/etc/ImageMagick-6/policy.xml"
          if [ -f "$POLICY_FILE" ]; then
            sudo sed -i 's/rights="none"/rights="read|write"/g' "$POLICY_FILE"
            sudo sed -i '/pattern="@\*"/d' "$POLICY_FILE"
          fi

      - name: Instalar dependências Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gerar vídeo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FISHAUDIO_API_KEY: ${{ secrets.FISHAUDIO_API_KEY }}
          FISHAUDIO_VOICE_ID: ${{ secrets.FISHAUDIO_VOICE_ID }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          USAR_CURACAO: "true"
          VIDEO_TYPE: long
          # ── Descomente pra testar sem publicar / mais rápido ──────────────
          # PULAR_UPLOAD: "true"
          # LIMITE_CLIPES_TESTE: "2"
          # ── Ajustes opcionais (já têm padrão sensato no código) ───────────
          # DURACAO_MAXIMA_CLIPE: "20"
          # ATIVAR_LEGENDA: "true"
        run: |
          # write_logfile=True não resolveu o travamento no write_videofile, então
          # em vez de continuar tentando adivinhar a causa às cegas, aqui a gente
          # tira uma "foto" do que o processo Python está fazendo por dentro
          # (stack trace real, via py-spy) a cada 3 min. Se travar de novo, o
          # arquivo diagnostico_stacks.log mostra exatamente em que linha ele
          # ficou parado — não precisa mais tentar reproduzir/adivinhar.
          pip install --quiet py-spy

          python -u generate_video.py > gerar_video_stdout.log 2>&1 &
          PID=$!
          echo "generate_video.py rodando com PID $PID"

          (
            while kill -0 "$PID" 2>/dev/null; do
              sleep 180
              if kill -0 "$PID" 2>/dev/null; then
                {
                  echo "=== dump $(date -u '+%Y-%m-%d %H:%M:%S') UTC ==="
                  sudo py-spy dump --pid "$PID" --locals
                  echo
                } >> diagnostico_stacks.log 2>&1
              fi
            done
          ) &
          MONITOR_PID=$!

          tail -f gerar_video_stdout.log --pid="$PID" &
          TAIL_PID=$!

          wait "$PID"
          EXIT_CODE=$?
          kill "$MONITOR_PID" 2>/dev/null || true
          kill "$TAIL_PID" 2>/dev/null || true
          exit $EXIT_CODE

      - name: Commit logs atualizados
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          touch videos_gerados.json temas_usados.json
          git add -f videos_gerados.json temas_usados.json
          git diff --staged --quiet || git commit -m "🎬 Novo vídeo longo gerado - $(date +'%Y-%m-%d')"
          git fetch origin main
          git pull origin main --rebase
          git push origin main || git push --force-with-lease origin main

      - name: Upload vídeo como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-long-${{ github.run_number }}
          path: videos/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload logs de diagnóstico (mesmo se travar ou der timeout)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-${{ github.run_number }}
          path: |
            gerar_video_stdout.log
            diagnostico_stacks.log
            videos/*.log
          retention-days: 7
          if-no-files-found: ignore
